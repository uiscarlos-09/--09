<!DOCTYPE html><html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página</title><style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d0814;
        color: white;
        text-align: center;
    }

    .contenedor {
        max-width: 900px;
        margin: auto;
        padding: 40px 20px;
    }

    h1 {
        color: #b77aff;
        font-size: 40px;
        margin-bottom: 10px;
    }

    p {
        color: #cfc5d9;
        font-size: 18px;
    }

    .video {
        margin: 30px auto;
        width: 100%;
        max-width: 800px;
    }

    iframe {
        width: 100%;
        height: 450px;
        border: none;
        border-radius: 15px;
    }

    .boton {
        display: inline-block;
        margin-top: 25px;
        padding: 15px 30px;
        background: #8e44ff;
        color: white;
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        border-radius: 10px;
    }

    .boton:hover {
        background: #a96cff;
    }
</style>

</head><body><div class="contenedor">

    <h1>everlasting </h1>

    <p>Bienvenido a mi página</p>

    <div class="video">
        <iframe
            src="https://www.youtube.com/embed/i4gG77tJeJg"
            title="Video de YouTube"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>

    <a
        class="boton"
        href="https://www.mediafire.com/file/robnz69zl8d6srm/%25F0%259D%2598%2588%25F0%259D%2598%25AF%25F0%259D%2598%25A2%25F0%259D%2598%25B3%25F0%259D%2598%25AA%25F0%259D%2598%25A6%25F0%259D%2598%25B9%25F0%259D%2598%25A6.7z/file"
        target="_blank"
        rel="noopener noreferrer">
        Descargar archivo
    </a>

</div>

</body>
</html>
