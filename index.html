<!DOCTYPE html><html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DBZ TTT Mods</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b0712;
        color: white;
    }

    /* BARRA */

    .navbar {
        background: #160d24;
        border-bottom: 1px solid #38204f;
        padding: 12px;
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .navbar a {
        display: inline-block;
        color: #ddd;
        text-decoration: none;
        padding: 10px 17px;
        margin: 3px;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.25s;
    }

    .navbar a:hover,
    .navbar a:active {
        background: #8e44ff;
        color: white;
    }

    /* CONTENEDOR */

    .contenedor {
        max-width: 950px;
        margin: auto;
        padding: 35px 18px 60px;
        text-align: center;
    }

    h1 {
        color: #b77aff;
        font-size: 40px;
        margin-bottom: 30px;
    }

    /* TARJETA */

    .tarjeta {
        background: #15101d;
        border: 1px solid #332043;
        border-radius: 18px;
        padding: 18px;
        margin-bottom: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .tarjeta h2 {
        color: #d4a8ff;
        margin: 5px 0 18px;
    }

    /* MINIATURA */

    .miniatura {
        display: block;
        width: 100%;
        overflow: hidden;
        border-radius: 14px;
    }

    .miniatura img {
        display: block;
        width: 100%;
        height: auto;
        transition: transform 0.3s;
    }

    .miniatura:hover img {
        transform: scale(1.03);
    }

    /* BOTONES */

    .boton {
        display: inline-block;
        margin: 18px 6px 5px;
        padding: 13px 25px;
        background: #8e44ff;
        color: white;
        text-decoration: none;
        border-radius: 9px;
        font-size: 16px;
        font-weight: bold;
        transition: 0.25s;
    }

    .boton:hover {
        background: #a96cff;
        transform: translateY(-2px);
    }

    .boton-download {
        background: #5d2ca8;
    }

    .boton-download:hover {
        background: #7540c9;
    }

    /* PIE */

    footer {
        background: #100a18;
        border-top: 1px solid #2d1c3d;
        padding: 22px;
        text-align: center;
        color: #8f829d;
    }

    /* CELULAR */

    @media (max-width: 600px) {

        h1 {
            font-size: 32px;
        }

        .navbar a {
            padding: 8px 10px;
            font-size: 14px;
        }

        .tarjeta {
            padding: 12px;
        }

        .boton {
            display: block;
            margin: 12px 0 5px;
        }

    }

</style>

</head><body><!-- NAVEGACIÓN -->

<nav class="navbar">

</nav>

</main>
